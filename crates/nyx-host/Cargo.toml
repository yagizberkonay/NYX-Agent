[package]
name = "nyx-host"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
nyx-core = { path = "../nyx-core" }
nyx-security = { path = "../nyx-security" }
nyx-tools = { path = "../nyx-tools" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
