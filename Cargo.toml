[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/nyx-core",
  "crates/nyx-security",
  "crates/nyx-tools",
  "crates/nyx-tools-fs",
  "crates/nyx-host",
  "crates/nyx-integrations",
  "crates/nyx-planner",
  "crates/nyx-agent",
  "crates/nyx-voice",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["NYX Contributors"]
repository = "https://github.com/yagizberkonay/NYX-Agent"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["serde", "v4"] }
