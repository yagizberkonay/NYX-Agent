[package]
name = "nyx-desktop"
version.workspace = true
description = "NYX local-first computer agent"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version = "1.85"

[lib]
name = "nyx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
anyhow.workspace = true
nyx-agent = { path = "../../../crates/nyx-agent" }
nyx-core = { path = "../../../crates/nyx-core" }
nyx-tools = { path = "../../../crates/nyx-tools" }
nyx-voice = { path = "../../../crates/nyx-voice" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.8", features = [] }
tokio = { version = "1.42", features = ["sync", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
